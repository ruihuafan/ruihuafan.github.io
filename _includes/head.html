<meta charset="utf-8">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root { --max: {{ include.max | default: '880px' }}; --fg: #0f172a; --muted: #475569; --link:#2563eb; --bg:#ffffff; --card:#f8fafc; }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; color:var(--fg); background:var(--bg);}
  header{border-bottom:1px solid #e2e8f0;background:#fff;position:sticky;top:0;backdrop-filter:saturate(180%) blur(6px)}
  nav{max-width:var(--max);margin:0 auto;display:flex;gap:18px;align-items:center;padding:12px 16px}
  nav a{color:var(--muted);text-decoration:none;font-weight:600}
  nav a:hover{color:var(--link)}
  .container{max-width:var(--max);margin:0 auto;padding:28px 16px}
  h1,h2,h3{line-height:1.2;margin:0 0 12px}
  h1{font-size:32px}
  h2{font-size:22px;margin-top:28px}
  h3{font-size:18px;margin-top:20px}
  .lead{color:var(--muted);margin:8px 0 18px}
  .card{background:var(--card);border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:14px 0}
  ul{padding-left:18px;margin:8px 0}
  footer{border-top:1px solid #e2e8f0;margin-top:40px;padding-top:12px}
  .muted{color:var(--muted)}
  a{color:var(--link);}
  a:hover{text-decoration:underline;}

  .hero{
    display:flex;
    flex-direction:row;     /* image left, text right */
    align-items:flex-start;
    gap:20px;               /* space between photo and text */
    flex-wrap:nowrap;       /* keep them on one line on wide screens */
  }

  .avatar-lg{
    width:280px;
    height:240px;
    border-radius:0;        /* square-ish photo */
    object-fit:cover;
    object-position:center top;
    border:1px solid #e2e8f0;
  }
  .avatar-pixel{
    width:280px;
    height:240px;
    flex:0 0 auto;
  }
  .avatar-canvas{
    display:none;
    image-rendering:pixelated;
    background:#f8fafc;
  }
  .avatar-pixel.is-ready .avatar-source{
    display:none;
  }
  .avatar-pixel.is-ready .avatar-canvas{
    display:block;
  }

  @media (max-width: 640px) {
    .hero{
      flex-direction:column;
      align-items:flex-start;
      flex-wrap:nowrap;
    }
  }

  /* Optional page layout with side TOC */
  .note-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  .note-toc {
    flex: 0 0 220px;
    font-size: 0.9rem;
    position: sticky;
    top: 80px;
    max-height: calc(100vh - 100px);
    overflow: auto;
    padding-right: 8px;
  }
  .note-toc h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 8px;
  }
  .note-toc ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  .note-toc li {
    margin: 4px 0;
  }
  .note-toc li.toc-h2,
  .note-toc li.toc-h3 {
    margin-left: 12px;
    font-size: 0.9em;
  }
  .note-toc a {
    text-decoration: none;
    color: var(--muted);
  }
  .note-toc a:hover {
    color: var(--link);
  }
  .note-content {
    flex: 1;
    min-width: 0;
  }
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    align-items: start;
    margin: 16px 0 28px;
  }
  .notes-grid-single {
    grid-template-columns: 1fr;
  }
  .notes-group {
    min-width: 0;
    background: var(--card);
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 16px;
  }
  .notes-group h2 {
    font-size: 19px;
    margin-top: 0;
  }
  .notes-group p {
    color: var(--muted);
    margin: 0 0 12px;
  }
  .notes-group ul {
    margin: 0;
    padding-left: 18px;
  }
  .notes-group li {
    line-height: 1.45;
    margin: 7px 0;
  }
  .mknotes-list {
    list-style: none;
    padding-left: 0;
  }
  .mknotes-list li {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 10px;
    align-items: baseline;
  }
  .mknotes-date {
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 0.86rem;
    white-space: nowrap;
  }

  @media (max-width: 800px) {
    .note-layout {
      flex-direction: column;
    }
    .note-toc {
      position: static;
      max-height: none;
      order: -1;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }
    .mknotes-list li {
      grid-template-columns: 1fr;
      gap: 0;
    }
  }

  /* Writing index: mknotes rendered as a filterable card feed */
  .post-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 18px 0 20px;
  }
  .post-chip {
    font: inherit;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid #e2e8f0;
    background: #fff;
    color: var(--muted);
  }
  .post-chip:hover { color: var(--link); border-color: #cbd5e1; }
  .post-chip.is-active { background: var(--link); border-color: var(--link); color: #fff; }

  .post-list { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .post-card {
    display: block;
    background: var(--card);
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 18px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  a.post-card:hover {
    border-color: #cbd5e1;
    box-shadow: 0 1px 3px rgba(15,23,42,.06);
    text-decoration: none;
  }
  .post-card--wip { border-style: dashed; cursor: default; }
  .post-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .post-card-head:empty { display: none; }
  .post-tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #eef2ff; color: #3730a3; }
  .post-tag--physics { background: #eff6ff; color: #1e40af; }
  .post-tag--ai      { background: #f5f3ff; color: #5b21b6; }
  .post-tag--math    { background: #ecfdf5; color: #065f46; }
  .post-tag--random  { background: #f1f5f9; color: #475569; }
  .post-tag--web     { background: #eff6ff; color: #1e40af; }
  .post-tag--game    { background: #fff7ed; color: #9a3412; }
  .post-tag--tool    { background: #ecfdf5; color: #065f46; }
  .post-tag--wip     { background: #f1f5f9; color: #64748b; }
  .post-date {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: .82rem;
    color: var(--muted);
  }
  .post-title { display: block; font-size: 17px; font-weight: 600; color: var(--fg); margin: 0 0 4px; }
  a.post-card:hover .post-title { color: var(--link); }
  .post-card--wip .post-title { color: var(--muted); }
  .post-summary { display: block; font-size: .95rem; color: var(--muted); line-height: 1.55; margin: 0; }
</style>

{% if include.mathjax %}
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams',
      macros: {
        Tr: '\\operatorname{Tr}',
        diag: '\\operatorname{diag}',
        bbZ: '\\mathbb{Z}',
        bbN: '\\mathbb{N}',
        bbR: '\\mathbb{R}',
        bbC: '\\mathbb{C}'
      }
    },
    svg: { fontCache: 'global' }
  };
</script>
<script id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>
{% endif %}
