<!doctype html>
<html lang="en">
<head>
  {% if page.toc %}{% assign maxw = '1100px' %}{% else %}{% assign maxw = '880px' %}{% endif %}
  {% include head.html max=maxw mathjax=page.use_math %}
</head>
<body>
  {% include nav.html %}

  <main id="top" class="container">
    {% if page.toc %}
    <div class="note-layout">
      <aside class="note-toc">
        <h2>Contents</h2>
        <nav id="note-toc"></nav>
      </aside>

      <article class="note-content">
        {{ content }}
      </article>
    </div>
    {% else %}
    {{ content }}
    {% endif %}
  </main>

  {% include toc-script.html %}
</body>
</html>
